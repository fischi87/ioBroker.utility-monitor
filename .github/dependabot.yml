# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'cron'
          timezone: 'Europe/Berlin'
          cronjob: '23 4 9 * *'
      open-pull-requests-limit: 15

    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'cron'
          timezone: 'Europe/Berlin'
          cronjob: '23 4 9 * *'
      open-pull-requests-limit: 15
      versioning-strategy: 'increase'
      cooldown:
          default-days: 7
      ignore:
          # @types/node must follow the Node version the adapter supports,
          # so major bumps are done deliberately instead of automatically
          - dependency-name: '@types/node'
            update-types:
                - 'version-update:semver-major'

    - package-ecosystem: 'npm'
      directory: '/admin/src-admin'
      schedule:
          interval: 'cron'
          timezone: 'Europe/Berlin'
          cronjob: '23 4 9 * *'
      open-pull-requests-limit: 15
      versioning-strategy: 'increase'
      cooldown:
          default-days: 7
      ignore:
          - dependency-name: '@types/node'
            update-types:
                - 'version-update:semver-major'
          # The custom jsonConfig component runs inside ioBroker.admin and shares
          # React, MUI and adapter-react-v5 as singletons with the Admin runtime.
          # As long as the stable Admin release is 7.x (React 18 / MUI 5), major
          # bumps of these packages would break the component for all users, so
          # they are upgraded deliberately together with the Admin 8 migration.
          - dependency-name: 'react'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: 'react-dom'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@types/react'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@types/react-dom'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@mui/material'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@mui/icons-material'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@emotion/react'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@emotion/styled'
            update-types:
                - 'version-update:semver-major'
          - dependency-name: '@iobroker/adapter-react-v5'
            update-types:
                - 'version-update:semver-major'
