# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'cron'
          timezone: 'Europe/Berlin'
          cronjob: '23 4 9 * *'
      open-pull-requests-limit: 15

    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'cron'
          timezone: 'Europe/Berlin'
          cronjob: '23 4 9 * *'
      open-pull-requests-limit: 15
      versioning-strategy: 'increase'
      cooldown:
          default-days: 7
      ignore:
          # @types/node must follow the Node version the adapter supports,
          # so major bumps are done deliberately instead of automatically
          - dependency-name: '@types/node'
            update-types:
                - 'version-update:semver-major'
          # TypeScript majors can break the type-check/build; upgrade deliberately
          - dependency-name: 'typescript'
            update-types:
                - 'version-update:semver-major'
